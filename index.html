    <script>
      // Safeguard against polyfills attempting to assign to window.fetch in environments where it is getter-only
      (function() {
        try {
          var originalFetch = window.fetch;
          var customFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return customFetch || originalFetch;
            },
            set: function(fn) {
              customFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // No-op if property is not reconfigurable
        }
      })();
    </script>
